version: '3.8'

services:
  # 1. Kafka (KRaft Mode)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    deploy:
      resources:
        limits:
          memory: 1G

  # 2. Postgres (Backend cho Airflow & App)
  postgres:
    image: postgres:13-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G

  # 3. Redis (Cache)
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M

  # 4. Airflow (Trái tim của hệ thống)
  airflow:
    build: .
    container_name: airflow
    restart: always
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - SPARK_HOME=/opt/spark
      # Tối ưu Scheduler cho máy tính
      - AIRFLOW__CORE__DAG_DIR_LIST_INTERVAL=60
      - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=30
      - AIRFLOW__CORE__PARALLELISM=32
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=16
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      # [THÊM MỚI] Chỉ định nơi dbt tìm file profiles.yml
      - DBT_PROFILES_DIR=/opt/airflow/dbt
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      # Mount file JSON Service Account vào để Airflow kết nối với Google Cloud
      - ./gcpkey.json:/opt/airflow/google-credentials.json
      # [THÊM MỚI] Mount thư mục dbt project vào container
      - ./dbt:/opt/airflow/dbt
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate && 
      airflow users create --username admin --password admin --firstname Khoi --lastname Nguyen --role Admin --email admin@example.com || true && 
      (airflow scheduler & airflow webserver)"
    deploy:
      resources:
        limits:
          memory: 6G

  # 5. Streamlit Dashboard
  streamlit_app:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: streamlit_app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_DB=airflow
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PROJECT_ID=stock-lambda-project
      - BQ_DATASET=stock_data_warehouse
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcpkey.json
    ports:
      - "8501:8501"
    volumes:
      - ./data/gcpkey.json:/app/gcpkey.json:ro
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data: