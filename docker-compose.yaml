version: '3.8'

services:
  # 1. Kafka (KRaft Mode)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    # BẢO MẬT: Chỉ cho phép Kafka nội bộ nói chuyện với nhau, chặn kết nối từ internet nã vào cổng 9092
    ports:
      - "127.0.0.1:9092:9092" 
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    deploy:
      resources:
        limits:
          memory: 1G # TĂNG RAM: 768M lên 1G để Kafka nuốt 87k dòng mượt hơn

  # 2. Postgres (Backend cho Airflow & App)
  postgres:
    image: postgres:13-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-KhoiNguyen_DB_2026!@#} # BẢO MẬT: Đổi pass cực mạnh
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432" # Vẫn mở ra ngoài để bạn có thể dùng DBeaver ở máy tính kết nối vào xem data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G # TĂNG RAM: Postgres cần thêm bộ nhớ để xử lý bảng Daily OHLC sau này

  # 3. Redis (Cache)
  redis:
    image: redis:alpine
    container_name: redis
    # BẢO MẬT: Redis rất dễ bị hack cắm mã độc đào coin. Chặn ngay cổng public!
    ports:
      - "127.0.0.1:6379:6379" 
    deploy:
      resources:
        limits:
          memory: 256M

  # 4. Airflow (Trái tim của hệ thống)
  airflow:
    build: .
    container_name: airflow
    restart: always
    depends_on:
      - postgres
      - kafka
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      # Cập nhật pass mới vào chuỗi kết nối
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-KhoiNguyen_DB_2026!@#}@postgres/airflow
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - SPARK_HOME=/opt/spark
      
      # Tối ưu Scheduler cho VPS 8GB
      - AIRFLOW__CORE__DAG_DIR_LIST_INTERVAL=60
      - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=30
      - AIRFLOW__CORE__PARALLELISM=32
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=16
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      
      - VNSTOCK_API_KEY=${VNSTOCK_API_KEY}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080" # Đổi lại 8080 cho dễ nhớ khi gõ trên trình duyệt
    command: >
      bash -c "airflow db migrate && 
      airflow users create --username admin --password admin --firstname Khoi --lastname Nguyen --role Admin --email admin@example.com || true && 
      (airflow scheduler & airflow webserver)"
    deploy:
      resources:
        limits:
          memory: 4G # TĂNG RAM: Cho Airflow 4GB thoải mái cào 1500 mã

volumes:
  postgres_data: